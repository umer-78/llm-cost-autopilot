name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.cache/autopilot
          key: autopilot-${{ hashFiles('autopilot/models.yaml', 'autopilot/data.py') }}
      - run: pip install -e '.[dev]'
      - run: pytest -q
      - name: Routing gate (router within a point of GPT-4o, saving held)
        run: python -m autopilot gate
